buildscript {
    // Only used when this module is opened standalone; inside an RN app the root project
    // already provides AGP + Kotlin.
    repositories { google(); mavenCentral() }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'com.rabbah.mdbrn'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        // The MDB/MQTT AARs are built with minSdk 30 (the CM30 terminal runs Android 11) -
        // consuming apps must set minSdkVersion 30 in their android/build.gradle ext.
        minSdkVersion 30
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// The three prebuilt AARs live in android/libs of this package. flatDir is registered on ALL
// projects because the consuming app resolves this module's dependencies in its own context.
// NOTE: the path is captured OUTSIDE the closure - inside allprojects{}, projectDir would
// resolve to each consumer project's own directory, not this module's.
def mdbAarDir = file('libs').absolutePath
rootProject.allprojects {
    repositories {
        flatDir { dirs mdbAarDir }
    }
}

repositories {
    flatDir { dirs 'libs' }
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-android'
    api(name: 'hardware-lib-7.9.1', ext: 'aar')
    api(name: 'mqtt-lib-2.0.0', ext: 'aar')
    // The CM30 vendor hardware runtime hardware-lib talks to on the real terminal.
    api(name: 'CM30-HardwareLibrary-1.0.9', ext: 'aar')
}
